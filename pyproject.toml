[project]
name = "dbpedia-qa"
version = "0.1.0"
description = "DBpedia GraphRAG System for 2WikiMultiHopQA Benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sparqlwrapper>=2.0.0",
    "requests>=2.28.0",
    "redis>=4.0.0",
    "spacy>=3.5.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
llm = [
    "ollama>=0.1.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
